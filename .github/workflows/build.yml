# Build, test, SignPath signing (version tags only) and release.
#
# Signing setup (Settings → Secrets and variables → Actions):
#   secret   SIGNPATH_API_TOKEN            token of the SignPath CI user
#   variable SIGNPATH_ORGANIZATION_ID      SignPath organization ID
#   variable SIGNPATH_PROJECT_SLUG         project slug (e.g. control-savegame-switcher)
#   variable SIGNPATH_SIGNING_POLICY_SLUG  optional, "release-signing" by default
# Without SIGNPATH_API_TOKEN the build still works and the zip is not signed.
# See docs/DEVELOPMENT.md, section "Code signing".

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release on tags
  actions: read     # SignPath downloads the exe to sign from the artifacts

jobs:
  build:
    # WinForms and the Windows registry: needs a Windows runner.
    runs-on: windows-latest

    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tag matches the version
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = (dotnet msbuild ControlSaveManager.csproj -getProperty:Version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in the .csproj."
          }

      - name: Test
        run: dotnet test tests/ControlSaveManager.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Single exe
        run: dotnet publish ControlSaveManager.csproj -p:PublishProfile=win-x64 --nologo

      - name: Exe to sign
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: bin/publish/win-x64/ControlSaveManager.exe
          if-no-files-found: error

      # Releases only: every signing request must be approved on SignPath.
      - name: Sign with SignPath
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: bin/signed

      - name: Check the signature
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature bin/signed/ControlSaveManager.exe
          "Signature: $($signature.Status) - $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The signed exe does not have a valid signature." }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $exe = if (Test-Path bin/signed/ControlSaveManager.exe) { 'bin/signed/ControlSaveManager.exe' } else { 'bin/publish/win-x64/ControlSaveManager.exe' }
          ./scripts/release.ps1 -SkipTests -Exe $exe
          $signed = if ($exe -like 'bin/signed/*') { 'true' } else { 'false' }
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Zip and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-save-manager
          path: |
            dist/*.zip
            dist/*.zip.sha256
            tests/ControlSaveManager.Tests/TestResults/*.trx

      - name: Draft release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body: |
            ${{ steps.zip.outputs.signed == 'true' && 'The exe is signed by SignPath Foundation.' || 'Warning: the exe is NOT signed (SignPath not configured or signing failed).' }}

            What's new is in the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
