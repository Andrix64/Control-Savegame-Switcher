# Build, test, SignPath signing (version tags only), Linux packages and one release with everything.
#
# Jobs:
#   test     Windows and Ubuntu
#   windows  zip with the exe (signed on version tags)
#   linux    tar.gz, deb, rpm and AppImage, smoke-tested in Ubuntu, Fedora and the AppImage
#   release  draft release with all the files (version tags only)
#
# Signing setup (Settings → Secrets and variables → Actions):
#   secret   SIGNPATH_API_TOKEN            token of the SignPath CI user
#   variable SIGNPATH_ORGANIZATION_ID      SignPath organization ID
#   variable SIGNPATH_PROJECT_SLUG         project slug (e.g. local-save-switcher)
#   variable SIGNPATH_SIGNING_POLICY_SLUG  optional, "release-signing" by default
# Without SIGNPATH_API_TOKEN the build still works and the zip is not signed.
# See docs/DEVELOPMENT.md, section "Code signing".

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release on tags
  actions: read     # SignPath downloads the exe to sign from the artifacts

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Lss.Tests -c Release

  windows:
    # Steam's registry key on Windows: needs a Windows runner.
    runs-on: windows-latest
    needs: test

    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    outputs:
      signed: ${{ steps.zip.outputs.signed }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Tag matches the version
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Lss.App/Lss.App.csproj -getProperty:Version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in the .csproj."
          }

      - name: Test
        run: dotnet test tests/Lss.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Single exe
        run: dotnet publish src/Lss.App/Lss.App.csproj -p:PublishProfile=win-x64 --nologo

      - name: Exe to sign
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: bin/publish/win-x64/LSS.exe
          if-no-files-found: error

      # Releases only: every signing request must be approved on SignPath.
      - name: Sign with SignPath
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: bin/signed

      - name: Check the signature
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature bin/signed/LSS.exe
          "Signature: $($signature.Status) - $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The signed exe does not have a valid signature." }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $exe = if (Test-Path bin/signed/LSS.exe) { 'bin/signed/LSS.exe' } else { 'bin/publish/win-x64/LSS.exe' }
          ./scripts/release.ps1 -SkipTests -Exe $exe
          $signed = if ($exe -like 'bin/signed/*') { 'true' } else { 'false' }
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Zip artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lss-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: tests/Lss.Tests/TestResults/*.trx

  linux:
    # ubuntu-22.04: an older glibc, so the packages run on more distributions.
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Version pinned, checked against the checksums published by nfpm.
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSL -o "nfpm_${NFPM_VERSION}_amd64.deb" "$base/nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep "nfpm_${NFPM_VERSION}_amd64.deb" checksums.txt | sha256sum -c -
          sudo dpkg -i "nfpm_${NFPM_VERSION}_amd64.deb"

      - name: Packages
        run: bash scripts/release.sh --skip-tests

      - name: "Smoke test: deb on Ubuntu 24.04"
        run: docker run --rm -v "$PWD/dist:/dist" ubuntu:24.04 bash -c "apt-get update -qq && apt-get install -y -qq /dist/lss_*_amd64.deb && lss --version"

      - name: "Smoke test: rpm on Fedora 42"
        run: docker run --rm -v "$PWD/dist:/dist" fedora:42 bash -c "dnf install -y -q /dist/lss-*.x86_64.rpm && lss --version"

      - name: "Smoke test: AppImage"
        run: chmod +x dist/*.AppImage && dist/LSS-*-x86_64.AppImage --appimage-extract-and-run --version

      - name: Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: lss-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  release:
    # Only on version tags: one draft with the Windows and Linux files.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux]

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lss-*
          merge-multiple: true
          path: dist

      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body: |
            ${{ needs.windows.outputs.signed == 'true' && 'The Windows exe is signed by SignPath Foundation.' || 'Warning: the Windows exe is NOT signed (SignPath not configured or signing failed).' }}

            The Linux packages are not signed: check each file against its .sha256.

            What's new is in the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
